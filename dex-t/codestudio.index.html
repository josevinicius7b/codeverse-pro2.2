<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeVerse Pro — Code Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent-a:#5ef0ff; --accent-b:#8b5cf6; --muted:#cfeaf2;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  font-family:'Inter',sans-serif;
  background:linear-gradient(135deg,#050715,#0a0522,#110a33);
  background-size:300% 300%;
  animation:gradientMove 8s ease infinite;
  color:#eafcff;
  overflow:hidden;
}
@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Fundo extra */
canvas#particles{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  z-index:-1;
  pointer-events:none;
}

/* Layout */
.container{
  display:grid;
  grid-template-columns:260px 1fr;
  height:100vh;
  gap:20px;
  padding:18px;
}
@media(max-width:900px){
  .container{grid-template-columns:1fr;}
  .sidebar{position:fixed;top:0;left:-100%;width:220px;height:100%;transition:all .4s ease;}
  .sidebar.open{left:0;}
  .menu-btn{display:block;position:fixed;top:20px;left:20px;z-index:10;background:linear-gradient(90deg,var(--accent-a),var(--accent-b));color:#050715;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:700;}
}

/* Sidebar */
.sidebar{
  background:rgba(15,25,50,0.6);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:20px;
  border:1px solid rgba(94,240,255,0.3);
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 0 25px rgba(94,240,255,0.15);
}
.brand{display:flex;align-items:center;gap:10px;}
.logo{
  width:52px;height:52px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent-b),var(--accent-a));
  display:flex;align-items:center;justify-content:center;
  color:#050715;font-weight:800;
}
.brand h1{font-family:'Orbitron',sans-serif;color:#fff;font-size:18px;margin:0;}
.brand p{font-size:12px;color:var(--muted);margin:0;}
.nav{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.nav button{
  padding:12px;border:none;background:transparent;color:var(--muted);
  border-radius:12px;text-align:left;cursor:pointer;font-weight:600;
  transition:all .3s;
}
.nav button:hover{
  background:linear-gradient(90deg,rgba(94,240,255,0.12),rgba(139,92,246,0.12));
  color:#fff;box-shadow:0 0 10px rgba(94,240,255,0.4);
}
.nav button.active{
  background:linear-gradient(90deg,var(--accent-a),var(--accent-b));
  color:#050715;box-shadow:0 0 20px rgba(94,240,255,0.6);
}
.footer{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;}

/* Main */
main{
  display:flex;
  flex-direction:column;
  backdrop-filter:blur(6px);
  background:rgba(255,255,255,0.03);
  border-radius:16px;
  padding:20px;
  overflow:auto;
  box-shadow:0 0 25px rgba(94,240,255,0.05);
}
main h1{
  font-family:'Orbitron',sans-serif;
  background:linear-gradient(90deg,var(--accent-a),var(--accent-b));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  font-size:28px;margin-bottom:10px;
}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.tab{
  background:rgba(255,255,255,0.08);
  border-radius:8px;padding:8px 14px;
  cursor:pointer;transition:.3s;
}
.tab.active{background:linear-gradient(90deg,var(--accent-a),var(--accent-b));color:#050715;font-weight:700;}
textarea{
  width:100%;height:260px;
  background:#060a14;border:1px solid rgba(94,240,255,0.2);
  color:#eafcff;border-radius:8px;padding:10px;font-family:monospace;font-size:14px;
}
.buttons{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
button.primary{
  background:linear-gradient(90deg,var(--accent-a),var(--accent-b));
  border:0;padding:10px 18px;border-radius:10px;
  color:#050715;font-weight:700;cursor:pointer;
}
iframe{
  margin-top:20px;width:100%;height:280px;border:0;border-radius:10px;background:white;
}
.output{
  margin-top:20px;padding:12px;background:rgba(255,255,255,0.05);
  border-radius:10px;white-space:pre-wrap;font-family:monospace;
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>

<div class="container">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div>
      <div class="brand">
        <div class="logo">CV</div>
        <div>
          <h1>CodeVerse Pro</h1>
          <p>Code Studio</p>
        </div>
      </div>

      <nav class="nav">
        <button onclick="location.href='inicial.index.html'">Início</button>
        <button onclick="location.href='aprendizado.index.html'">Aprendizado</button>
        <button onclick="location.href='Mentor.index.html'">Mentor IA</button>
        <button onclick="location.href='site.index.html'">WebVerse</button>
        <button class="active">Code Studio</button>
      </nav>
    </div>
    <div class="footer">
      <span>visitante</span><span id="timeNow">--:--</span>
    </div>
  </aside>

  <!-- Main -->
  <main>
    <h1>🧠 Code Studio — Multi-Linguagem</h1>
    <div class="tabs" id="langTabs">
      <div class="tab active" data-lang="html">HTML</div>
      <div class="tab" data-lang="css">CSS</div>
      <div class="tab" data-lang="js">JavaScript</div>
      <div class="tab" data-lang="python">Python</div>
      <div class="tab" data-lang="java">Java</div>
      <div class="tab" data-lang="c">C</div>
    </div>

    <textarea id="codeArea"></textarea>
    <div class="buttons">
      <button class="primary" id="runBtn">▶️ Executar</button>
      <button class="primary" id="saveBtn">💾 Salvar</button>
      <button class="primary" id="clearBtn">🧹 Limpar</button>
    </div>

    <iframe id="preview"></iframe>
    <div class="output" id="outputBox" style="display:none;"></div>
  </main>
</div>

<script>
// ⏰ Relógio
const timeNow=document.getElementById("timeNow");
setInterval(()=>{const d=new Date();timeNow.textContent=d.toLocaleTimeString();},1000);

// Menu responsivo
function toggleMenu(){document.getElementById("sidebar").classList.toggle("open");}

// Alternar abas e salvar
const tabs=document.querySelectorAll(".tab");
const area=document.getElementById("codeArea");
const preview=document.getElementById("preview");
const output=document.getElementById("outputBox");
let currentLang="html";
const defaults={
  html:"<h1>Olá mundo</h1><p>Bem-vindo ao Code Studio!</p>",
  css:"body{font-family:Inter;text-align:center;background:#f9f9f9;color:#333;}",
  js:"console.log('Olá do JavaScript!');",
  python:"print('Olá do Python (simulação)')",
  java:"public class Main { public static void main(String[] args){ System.out.println('Olá Java!'); } }",
  c:"#include <stdio.h>\nint main(){ printf('Olá C'); return 0; }"
};
let storage=JSON.parse(localStorage.getItem("cv_code_studio")||"{}");

function loadLang(lang){
  currentLang=lang;
  tabs.forEach(t=>t.classList.toggle("active",t.dataset.lang===lang));
  area.value=storage[lang]||defaults[lang];
  output.style.display="none";
  preview.style.display=(["html","css","js"].includes(lang))?"block":"none";
}
tabs.forEach(t=>t.onclick=()=>loadLang(t.dataset.lang));
loadLang("html");

document.getElementById("runBtn").onclick=()=>{
  storage[currentLang]=area.value;
  localStorage.setItem("cv_code_studio",JSON.stringify(storage));
  if(["html","css","js"].includes(currentLang)){
    const html=storage.html||defaults.html;
    const css=storage.css||defaults.css;
    const js=storage.js||defaults.js;
    preview.srcdoc=`<style>${css}</style>${html}<script>${js}<\/script>`;
  }else{
    output.style.display="block";
    output.textContent="🖥️ Saída simulada:\n\n"+simulateOutput(currentLang,area.value);
  }
};
document.getElementById("saveBtn").onclick=()=>{
  storage[currentLang]=area.value;
  localStorage.setItem("cv_code_studio",JSON.stringify(storage));
  alert("✅ Código salvo localmente para "+currentLang.toUpperCase());
};
document.getElementById("clearBtn").onclick=()=>{area.value="";};
function simulateOutput(lang,code){
  switch(lang){
    case "python":return "Python executado (simulado):\n"+(code.includes("print")?"Olá mundo!":"Execução concluída");
    case "java":return "Java compilado (simulado):\nSaída -> Olá do Java";
    case "c":return "Compilação C simulada\nSaída -> Olá do C";
    default:return "Execução não suportada.";
  }
}

// 🎇 Partículas
const c=document.getElementById('particles');
const ctx=c.getContext('2d');
let w,h,particles=[];
function resize(){w=c.width=innerWidth;h=c.height=innerHeight;}
window.addEventListener('resize',resize);resize();
function initParticles(){
  particles=[];
  for(let i=0;i<60;i++){
    particles.push({
      x:Math.random()*w,
      y:Math.random()*h,
      r:Math.random()*2+1,
      d:Math.random()*0.8+0.2
    });
  }
}
function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='rgba(94,240,255,0.8)';
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  move();requestAnimationFrame(draw);
}
function move(){
  particles.forEach(p=>{
    p.y+=p.d;
    if(p.y>h)p.y=0,p.x=Math.random()*w;
  });
}
initParticles();draw();
</script>
</body>
</html>
