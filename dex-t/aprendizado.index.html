<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CodeVerse Pro — Aprendizado JS & Python</title>

<style>
:root{
  --accent-a:#5ef0ff;
  --accent-b:#8b5cf6;
  --muted:#9fb3c8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  font-family:'Inter',sans-serif;
  color:#eafcff;
  background:linear-gradient(145deg,#0b0c1a,#1b1440,#050a24);
  background-size:300% 300%;
  animation:bgmove 12s ease infinite;
}
@keyframes bgmove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.container{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:18px;
  padding:18px;
  min-height:100vh;
  transition:all .3s ease;
}

/* ===== SIDEBAR ===== */
.sidebar{
  background:rgba(255,255,255,0.03);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(10px);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  transition:all .3s ease;
}
.brand{
  display:flex;
  gap:10px;
  align-items:center;
}
.logo{
  width:48px;height:48px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent-b),var(--accent-a));
  display:flex;align-items:center;justify-content:center;
  color:#050715;font-weight:800;
}
.brand h1{color:#fff;font-size:16px;}
.brand p{color:var(--muted);font-size:12px;margin-top:3px;}

nav{margin-top:16px;display:flex;flex-direction:column;gap:8px}
nav button{
  background:transparent;
  border:0;
  color:var(--muted);
  text-align:left;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  transition:all .2s ease;
}
nav button:hover{
  background:linear-gradient(90deg, rgba(94,240,255,0.06), rgba(139,92,246,0.04));
  color:var(--accent-a);
}
nav button.active{
  background:linear-gradient(90deg,var(--accent-a),var(--accent-b));
  color:#050715;
}

/* Rodapé do menu */
.sidebar-footer{
  font-size:13px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  width:100%;
  margin-top:auto;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,0.05);
}

/* Botão hamburguer */
.menu-toggle{
  display:none;
  position:absolute;
  top:14px;
  right:14px;
  background:rgba(255,255,255,0.05);
  border:0;
  color:#eafcff;
  font-size:20px;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* ===== MAIN ===== */
main{
  background:rgba(255,255,255,0.02);
  border-radius:16px;
  padding:18px;
  backdrop-filter:blur(8px);
  box-shadow:0 6px 30px rgba(10,10,20,0.4);
  overflow:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  flex-wrap:wrap;
  gap:8px;
}
.search{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.04);
  padding:8px 12px;
  border-radius:10px;
  flex:1;
  min-width:200px;
}
.search input{
  background:transparent;
  border:0;
  color:#eafcff;
  outline:none;
  width:100%;
}
.chips{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{
  background:rgba(255,255,255,0.06);
  padding:8px 12px;
  border-radius:999px;
  color:var(--muted);
  font-weight:600;
}
.lang-select{
  padding:8px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.04);
  background:transparent;
  color:var(--accent-a);
}

/* ===== GRID PRINCIPAL ===== */
.grid{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:16px;
  min-height:calc(100vh - 140px);
}
.lesson-list{
  background:rgba(255,255,255,0.02);
  padding:12px;
  border-radius:12px;
  overflow:auto;
}
.lesson-item{
  padding:10px;
  border-radius:8px;
  color:var(--muted);
  cursor:pointer;
  margin-bottom:8px;
}
.lesson-item:hover{
  background:rgba(94,240,255,0.03);
  color:var(--accent-a);
}
.lesson-item.active{
  background:linear-gradient(90deg,var(--accent-a),var(--accent-b));
  color:#050b16;
  font-weight:700;
}

.lesson-main{
  background:rgba(255,255,255,0.02);
  padding:12px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls .small{font-size:13px;color:var(--muted)}
button{cursor:pointer;padding:8px 12px;border-radius:8px;border:0;font-weight:600}
.primary{background:linear-gradient(90deg,var(--accent-a),var(--accent-b));color:#050b16}
.ghost{background:rgba(255,255,255,0.06);color:#eafcff}

textarea.code{
  width:100%;
  min-height:160px;
  background:#04050a;
  border:1px solid rgba(255,255,255,0.03);
  color:#eafcff;
  padding:10px;
  border-radius:8px;
  font-family:ui-monospace;
  resize:vertical;
}
iframe#jsPreview{
  width:100%;
  height:260px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.04);
  background:#03040a;
}
pre#pyOutput{
  display:none;
  background:#02030a;
  color:#eafcff;
  padding:10px;
  border-radius:8px;
  margin-top:8px;
  min-height:140px;
  overflow:auto;
}

/* ===== MOBILE ===== */
@media(max-width:900px){
  .container{grid-template-columns:1fr;padding:10px}
  .grid{grid-template-columns:1fr}
  .sidebar{
    position:fixed;
    top:0;left:0;
    height:100vh;
    width:220px;
    transform:translateX(-100%);
    transition:transform .3s ease;
    z-index:1000;
  }
  .sidebar.open{transform:translateX(0);}
  .menu-toggle{display:block;z-index:1100;position:fixed;top:14px;left:14px;}
}
</style>
</head>
<body>

<div class="container">
  <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  
  <aside class="sidebar" id="sidebar">
    <div>
      <div class="brand">
        <div class="logo">CV</div>
        <div>
          <h1>CodeVerse Pro</h1>
          <p>Aprendizado • JS & Python</p>
        </div>
      </div>
      <nav>
        <button onclick="window.location.href='inicial.index.html'">Início</button>
        <button class="active">Aprendizado</button>
        <button onclick="window.location.href='Mentor.index.html'">Mentor IA</button>
        <button onclick="window.location.href='site.index.html'">WebVerse</button>
        <button onclick="window.location.href='codestudio.index.html'">Code Studio</button>
      </nav>
    </div>
    <div class="sidebar-footer">
      <div>visitante</div>
      <div id="timeNow">--:--:--</div>
    </div>
  </aside>

  <main>
    <div class="header">
      <div class="search">🔍 <input id="globalSearch" placeholder="Pesquisar lições..." /></div>
      <div class="chips">
        <div class="chip" id="dateNow">--/--/----</div>
        <select id="langSelect" class="lang-select">
          <option value="js">JavaScript</option>
          <option value="py">Python</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="lesson-list" id="lessonList">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-weight:700;color:#eafcff">Lições</div>
          <div style="font-size:13px;color:var(--muted)" id="lessonCounter">0</div>
        </div>
        <div id="lessonsContainer"></div>
      </div>

      <div class="lesson-main">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
          <div>
            <h2 id="lessonTitle">Título</h2>
            <div id="lessonDesc" style="color:var(--muted);font-size:13px">Descrição</div>
          </div>
          <div class="controls">
            <div class="small" id="langTag">JavaScript</div>
            <button id="prevBtn" class="ghost">Anterior</button>
            <button id="nextBtn" class="ghost">Próxima</button>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
          <button id="tryBtn" class="primary">Tentar sozinho</button>
          <button id="resetBtn" class="ghost">Reset</button>
          <button id="verifyBtn" class="ghost">Verificar</button>
          <div style="flex:1"></div>
          <button id="runBtn" class="primary">Executar</button>
          <button id="saveBtn" class="ghost">Salvar</button>
        </div>

        <div class="editor" style="margin-top:10px">
          <textarea id="codeArea" class="code" placeholder="// escreva seu código aqui"></textarea>
          <iframe id="jsPreview"></iframe>
          <pre id="pyOutput"></pre>
          <div id="feedback" style="margin-top:10px;font-size:14px;color:var(--accent-a)"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const lessons = {
  js: [
    {title:"Olá Mundo",desc:"Introdução ao JavaScript.",code:"console.log('Olá Mundo!');"},
    {title:"Variáveis",desc:"Aprenda let, const e var.",code:"let nome='CodeVerse'; console.log(nome);"},
    {title:"Funções",desc:"Crie e chame funções.",code:"function soma(a,b){return a+b;} console.log(soma(3,4));"},
    {title:"Condições",desc:"If e else.",code:"let idade=18; if(idade>=18){console.log('Maior de idade');}"},
    {title:"Loops",desc:"Usando for.",code:"for(let i=1;i<=5;i++){console.log(i);}"},
    {title:"Arrays",desc:"Trabalhando com listas.",code:"const nums=[1,2,3]; nums.forEach(n=>console.log(n));"},
    {title:"Objetos",desc:"Usando objetos.",code:"const pessoa={nome:'Ana',idade:22}; console.log(pessoa.nome);"},
    {title:"Eventos",desc:"Interaja com o usuário.",code:"document.body.onclick=()=>alert('Clique detectado!');"},
    {title:"DOM",desc:"Manipule elementos da página.",code:"document.body.innerHTML='<h1>Alterado!</h1>';"},
    {title:"Final JS",desc:"Conclusão da jornada JS!",code:"console.log('Parabéns, finalizou JS!');"}
  ],
  py: [
    {title:"Olá Mundo",desc:"Introdução ao Python.",code:"print('Olá Mundo!')"},
    {title:"Variáveis",desc:"Crie variáveis.",code:"nome='CodeVerse'\nprint(nome)"},
    {title:"Funções",desc:"Defina e chame funções.",code:"def soma(a,b):\n    return a+b\nprint(soma(3,4))"},
    {title:"Condições",desc:"If e else.",code:"idade=18\nif idade>=18:\n    print('Maior de idade')"},
    {title:"Loops",desc:"Usando for.",code:"for i in range(1,6):\n    print(i)"},
    {title:"Listas",desc:"Manipulando listas.",code:"nums=[1,2,3]\nfor n in nums:\n    print(n)"},
    {title:"Dicionários",desc:"Usando dict.",code:"pessoa={'nome':'Ana','idade':22}\nprint(pessoa['nome'])"},
    {title:"Input",desc:"Entrada do usuário.",code:"nome=input('Digite seu nome: ')\nprint('Olá',nome)"},
    {title:"Arquivos",desc:"Abrindo arquivos.",code:"open('dados.txt','w').write('Exemplo')"},
    {title:"Final Python",desc:"Conclusão da jornada!",code:"print('Parabéns, finalizou Python!')"}
  ]
};

let currentLang="js", currentIndex=0;
const lessonsContainer=document.getElementById('lessonsContainer');
const codeArea=document.getElementById('codeArea');
const jsPreview=document.getElementById('jsPreview');
const pyOutput=document.getElementById('pyOutput');
const feedback=document.getElementById('feedback');

function loadLessons(){
  lessonsContainer.innerHTML="";
  const data=lessons[currentLang];
  document.getElementById('lessonCounter').textContent=data.length;
  data.forEach((l,i)=>{
    const d=document.createElement("div");
    d.className="lesson-item";
    d.textContent=(i+1)+". "+l.title;
    if(i===currentIndex)d.classList.add("active");
    d.onclick=()=>{currentIndex=i;showLesson();};
    lessonsContainer.appendChild(d);
  });
}
function showLesson(){
  const l=lessons[currentLang][currentIndex];
  document.getElementById('lessonTitle').textContent=l.title;
  document.getElementById('lessonDesc').textContent=l.desc;
  codeArea.value=l.code;
  feedback.textContent="";
  document.querySelectorAll('.lesson-item').forEach((e,i)=>e.classList.toggle('active',i===currentIndex));
  pyOutput.style.display="none"; jsPreview.style.display="none";
}
function updateTime(){
  const d=new Date();
  document.getElementById('timeNow').textContent=d.toLocaleTimeString();
  document.getElementById('dateNow').textContent=d.toLocaleDateString();
}
setInterval(updateTime,1000);updateTime();

document.getElementById('tryBtn').onclick=()=>{codeArea.value="";feedback.textContent="🧠 Modo prática livre ativado!";};
document.getElementById('resetBtn').onclick=()=>{codeArea.value=lessons[currentLang][currentIndex].code;feedback.textContent="🔄 Código resetado.";};
document.getElementById('verifyBtn').onclick=()=>{
  const val=codeArea.value.toLowerCase();
  if(val.includes("print")||val.includes("console.log")){
    feedback.textContent="✅ Parece estar certo! Continue assim 🚀";
  } else {
    feedback.textContent="⚠️ Verifique se está imprimindo algo na tela!";
  }
};
document.getElementById('runBtn').onclick=()=>{
  if(currentLang==="js"){
    jsPreview.style.display="block";pyOutput.style.display="none";
    jsPreview.srcdoc=`<script>try{${codeArea.value}}catch(e){document.body.innerHTML='<pre style=color:red>'+e+'</pre>';}<\/script>`;
  } else {
    pyOutput.style.display="block";jsPreview.style.display="none";
    pyOutput.textContent="(Simulação) Resultado:\n" + codeArea.value.split("\n").map(l=>"  "+l).join("\n");
  }
  feedback.textContent="💡 Código executado!";
};
document.getElementById('saveBtn').onclick=()=>{feedback.textContent="💾 (Simulação) Código salvo com sucesso!";};
document.getElementById('nextBtn').onclick=()=>{if(currentIndex<lessons[currentLang].length-1){currentIndex++;showLesson();}};
document.getElementById('prevBtn').onclick=()=>{if(currentIndex>0){currentIndex--;showLesson();}};
document.getElementById('langSelect').onchange=(e)=>{currentLang=e.target.value;currentIndex=0;loadLessons();showLesson();};

/* Toggle menu mobile */
function toggleMenu(){
  document.getElementById('sidebar').classList.toggle('open');
}

loadLessons();showLesson();
</script>

</body>
</html>
