<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeVerse Pro — Página Inicial</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{height:100%;font-family:'Orbitron',sans-serif;overflow:hidden;}

/* ======== VÍDEO DE FUNDO ======== */
video.bg{
  position:fixed;top:0;left:0;width:100%;height:100%;
  object-fit:cover;z-index:-3;filter:brightness(0.5) saturate(1.3);
}

/* ======== OVERLAY ANIMADO ======== */
.overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(120deg,rgba(0,0,0,0.25),rgba(0,0,0,0.5));
  animation:gradmove 10s infinite alternate;z-index:-2;
}
@keyframes gradmove{
  0%{background:linear-gradient(120deg,rgba(0,0,0,0.25),rgba(0,0,0,0.5))}
  100%{background:linear-gradient(240deg,rgba(0,0,0,0.2),rgba(0,0,0,0.7))}
}

/* ======== PARTÍCULAS NEON ======== */
#particles{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:-1;pointer-events:none;
}

/* ======== CONTEÚDO CENTRAL ======== */
.content{
  position:relative;z-index:1;
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  color:#eafcff;animation:fadeIn 2s ease forwards;opacity:0;
  padding:20px;
}
@keyframes fadeIn{to{opacity:1}}

h1{
  font-size:3.4rem;margin-bottom:10px;
  background:linear-gradient(90deg,#5ef0ff,#8b5cf6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 20px rgba(94,240,255,0.3);
  word-wrap:break-word;
  max-width:90vw;
}
p.tagline{
  font-size:1.2rem;color:#a5bedf;font-weight:500;
  margin-bottom:50px;text-shadow:0 0 6px rgba(94,240,255,0.3);
  max-width:90vw;line-height:1.4;
}

/* ======== MENU INTERATIVO ======== */
.menu{
  display:flex;flex-wrap:wrap;gap:22px;justify-content:center;
  max-width:95vw;
}
.menu a{
  text-decoration:none;
  padding:16px 48px;
  font-size:1.2rem;font-weight:700;
  color:#00ffff;
  border:2px solid #00ffff;
  border-radius:14px;
  background:rgba(0,0,0,0.25);
  position:relative;overflow:hidden;
  transition:.3s;
  box-shadow:0 0 12px #00ffff,0 0 25px #00ffff33;
  flex:1 1 200px;
  text-align:center;
  min-width:150px;
}
.menu a::before{
  content:'';position:absolute;
  top:-50%;left:-50%;width:200%;height:200%;
  background:linear-gradient(45deg,#00ffff,#ff00ff,#00ffff,#ff00ff);
  animation:shine 4s linear infinite;
  z-index:0;opacity:0.3;
}
@keyframes shine{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.menu a span{position:relative;z-index:1;}
.menu a:hover{
  color:#ff00ff;
  box-shadow:0 0 20px #ff00ff,0 0 40px #ff00ff;
  transform:scale(1.1);
}

/* ======== RODAPÉ ======== */
footer{
  position:fixed;bottom:10px;width:100%;text-align:center;
  font-family:'Inter',sans-serif;font-size:.9rem;color:#93a4c3;
  padding:5px 10px;
  text-shadow:0 0 6px rgba(0,255,255,0.3);
}

/* ======== RESPONSIVIDADE ======== */
@media(max-width:900px){
  h1{font-size:2.6rem}
  .menu a{padding:14px 36px;font-size:1.1rem}
}
@media(max-width:650px){
  body,html{overflow:auto;height:auto}
  .content{padding:40px 10px;min-height:100vh;}
  h1{font-size:2.2rem;margin-bottom:12px;}
  p.tagline{font-size:1rem;margin-bottom:30px;}
  .menu{gap:16px;}
  .menu a{padding:12px 24px;font-size:.95rem;flex:1 1 120px;}
  footer{font-size:.8rem;position:static;margin-top:30px;}
}
@media(max-width:400px){
  h1{font-size:1.8rem}
  .menu a{padding:10px 20px;font-size:.9rem}
}
</style>
</head>
<body>

<!-- ======== VÍDEO DE FUNDO ======== -->
<video class="bg" autoplay muted loop playsinline>
  <source src="grok-video-d9ce8c4a-938f-4df2-b163-a0385ac710a8.mp4" type="video/mp4">
  Seu navegador não suporta vídeo HTML5.
</video>

<div class="overlay"></div>
<canvas id="particles"></canvas>

<!-- ======== CONTEÚDO CENTRAL ======== -->
<div class="content">
  <h1>CodeVerse Pro</h1>
  <p class="tagline">Sua imaginação traduzida em código</p>

  <div class="menu">
    <a href="inicial.index.html"><span>Entrar</span></a>
    <a href="aprendizado.index.html"><span>Aprender</span></a>
    <a href="sobre.index.html"><span>Sobre</span></a>
  </div>
</div>

<footer>© 2025 CodeVerse Pro — Tecnologia e inovação conectadas</footer>

<script>
/* ======== PARTÍCULAS ======== */
const c=document.getElementById('particles'),ctx=c.getContext('2d');
let w=c.width=innerWidth,h=c.height=innerHeight;
const ps=[];
function r(a,b){return Math.random()*(b-a)+a;}
for(let i=0;i<150;i++){
  ps.push({x:r(0,w),y:r(0,h),r:r(1,3),vx:r(-0.6,0.6),vy:r(-0.6,0.6),hue:r(180,300)});
}
function draw(){
  ctx.clearRect(0,0,w,h);
  for(const p of ps){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<-10)p.x=w+10;if(p.x>w+10)p.x=-10;
    if(p.y<-10)p.y=h+10;if(p.y>h+10)p.y=-10;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${p.hue},100%,60%,.8)`;ctx.fill();
  }
  for(let i=0;i<ps.length;i++){
    for(let j=i+1;j<ps.length;j++){
      const a=ps[i],b=ps[j];
      const dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
      if(d<110){
        ctx.strokeStyle=`rgba(94,240,255,${(1-d/110)*.25})`;
        ctx.lineWidth=.8;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}
draw();
onresize=()=>{w=c.width=innerWidth;h=c.height=innerHeight;}
</script>
</body>
</html>
